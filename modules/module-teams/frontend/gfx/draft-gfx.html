    <div class="topbar">
      <!-- LEFT / BLUE -->
      <div id="blue-team" class="team-panel panel-left">
        <div id="blue-name" class="team-name"></div>
        <div id="blue-score" class="score sr-only">1</div>
        <div class="team-logo-block">
          <div class="logo-circle">
            <img id="blue-logo" class="logo" src="../img/Mandragora.png" alt="">
          </div>
          <div class="pips" id="blue-pips">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
        </div>
      </div>
    
      <!-- MIDDLE GAP (timer/patch si besoin) -->
      <div class="topbar-gap"></div>
    
      <!-- RIGHT / RED -->
      <div id="red-team" class="team-panel panel-right">
        <div class="team-logo-block">
          <div class="logo-circle">
            <img id="red-logo" class="logo" src="../img/Pandore.png" alt="">
          </div>
          <div class="pips" id="red-pips">
            <span class="pip"></span><span class="pip"></span><span class="pip"></span>
          </div>
        </div>
        <div id="red-name" class="team-name"></div>
        <div id="red-score" class="score sr-only">2</div>
      </div>
    </div>

    <div id="draft" class="draft-overlay">
      <iframe id="draft_iframe" title="draft_overlay" width="1920" height="1080" 
      src =""></iframe>
    </div>

    <!-- <img src="./img/Screenshot 2025-09-22 13-47-38.png" alt="" id="staticSB" style="position: absolute;z-index: -1;overflow: hidden; top: 0;"> -->

    <script src="js/draft.js" defer></script>
    <script>
      function updatePips(team) {
        const scoreEl = document.getElementById(`${team}-score`);
        const pips = document.querySelectorAll(`#${team}-pips .pip`);
        if (!scoreEl) return;
      
        const score = parseInt(scoreEl.textContent.trim(), 10) || 0;
      
        pips.forEach((pip, i) => {
          if (i < score) {
            pip.classList.add("filled");
          } else {
            pip.classList.remove("filled");
          }
        });
      }
      
      // maj des 2 équipes
      function refreshAllPips() {
        updatePips("blue");
        updatePips("red");
      }
      
      // premier rendu
      refreshAllPips();
      
      // si tes scores changent via JS, rappelle refreshAllPips()
      </script>
