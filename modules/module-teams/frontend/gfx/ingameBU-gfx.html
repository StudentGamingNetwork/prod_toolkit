<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In-Game Backup gfx</title>
    <script src="/static/main-bundle.js"></script>
    <link rel="stylesheet" href="style/ingameBU.css" />
    <link rel="stylesheet" href="/pages/op-plugin-theming/active/index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
  </head>
  <body class="module-teams-ingameBU-gfx">
    <!-- BLUE -->
    <div id="ingame-blue" class="ingame-side ingame-side--blue" data-has-bo="1">
      <div id="blue-name" class="ingame-name"></div>

      <div class="ingame-meta">
        <div id="blue-standing" class="ingame-standing"></div>
        <div class="bo-crop">
          <img id="blue-bo" class="ingame-bo" src="./img/left_0.png" alt="">
        </div>
      </div>
    </div>

    <!-- RED -->
    <div id="ingame-red" class="ingame-side ingame-side--red" data-has-bo="1">
      <div id="red-name" class="ingame-name"></div>

      <div class="ingame-meta">
        <div id="red-standing" class="ingame-standing"></div>
        <div class="bo-crop">
        <img id="red-bo" class="ingame-bo" src="./img/right_0.png" alt="" />
        </div>
      </div>
    </div>
    <div class="team-logo-bottom team-logo-bottom--blue">
      <img id="blue-logo-big" src="" alt="">
    </div>
    
    <div class="team-logo-bottom team-logo-bottom--red">
      <img id="red-logo-big" src="" alt="">
    </div>
    
    <img src="./img/ui.png" alt="" id="staticSB" style="position: absolute;z-index: -1;overflow: hidden;">
    <img src="./img/FOND_LOGOS.png" alt="" id="staticBB" style="position: absolute;z-index: -1;overflow: hidden;">

    <script src="js/ingameBU.js" defer></script>
  </body>
</html>
