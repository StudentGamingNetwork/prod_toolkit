<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>In-Game Team gfx</title>
    <script src="/static/main-bundle.js"></script>
    <link rel="stylesheet" href="style/in-game.css" />
    <link rel="stylesheet" href="/pages/op-plugin-theming/active/index.css" />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
  </head>
  <body class="module-teams-ingame-gfx">
    <div class="team-containers">
      <div class="team-block blue">
        <div class='logo-container'>
          <img id="logo-blue" class="blue logo" src="../img/Mandragora.png" alt="">
        </div>
        <div class="info-column">
          <div id="blue-name" class="blue name"></div>
          <div id="blue-tag" class="blue tag"></div>
        </div>
      </div>
      <div class="team-block red">
        <div class='logo-container'>
          <img id="logo-red" class="red logo" src="../img/Mandragora.png" alt="">
        </div>
        <div class="info-column">
          <div id="red-name" class="red name"></div>
          <div id="red-tag" class="red tag"></div>
        </div>
      </div>
  </div>
  <div id="point-container">
      <div class="points-team points-blue">
        <div class="point point-blue" id="point-blue-1"></div>
        <div class="point point-blue" id="point-blue-2"></div>
        <div class="point point-blue" id="point-blue-3"></div>
        <div class="point point-blue" id="point-blue-4"></div>
        <div class="point point-blue" id="point-blue-5"></div>
      </div>
      <div class="points-team points-red">
        <div class="point point-red" id="point-red-1"></div>
        <div class="point point-red" id="point-red-2"></div>
        <div class="point point-red" id="point-red-3"></div>
        <div class="point point-red" id="point-red-4"></div>
        <div class="point point-red" id="point-red-5"></div>
      </div>
    </div>
    <img src="./img/ui.png" alt="" id="staticBB" style="position: absolute;z-index: -1;overflow: hidden;">

    <script src="js/in-game.js" defer></script>
  </body>
</html>
